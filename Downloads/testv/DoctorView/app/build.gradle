plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.doctorview.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.doctorview.app"
        minSdk 26          // Android 8.0 (Oreo) and newer
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // ---- AndroidX & Material Design ----
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Image loading (doctor photos)
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ---- Navigation (bottom navigation + nav graph) ----
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ---- Firebase ----
    // The BoM keeps all Firebase versions aligned — you never need to
    // write a version number for the Firebase libraries below.
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'       // Login / Register
    implementation 'com.google.firebase:firebase-firestore'  // Doctors, Appointments, Records
    implementation 'com.google.firebase:firebase-database'   // Live chat
    implementation 'com.google.firebase:firebase-storage'    // Profile / report images
}
